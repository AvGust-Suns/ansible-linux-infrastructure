---
- name: Configure SSH security settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PermitRootLogin {{ ssh_hardening_permit_root_login }}
      PasswordAuthentication {{ ssh_hardening_password_authentication }}
      PubkeyAuthentication {{ ssh_hardening_pubkey_authentication }}
      KbdInteractiveAuthentication {{ ssh_hardening_kbd_interactive_authentication }}
  notify: Restart SSH

- name: Validate SSH configuration
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: false
