---
- name: Install Prometheus
  ansible.builtin.apt:
    name: "{{ prometheus_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Prometheus web listener
  ansible.builtin.copy:
    dest: "{{ prometheus_defaults_path }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      ARGS="--web.listen-address={{ prometheus_web_listen_address }}"
  notify: Restart Prometheus

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: "{{ prometheus_rules_directory }}"
    state: directory
    owner: root
    group: prometheus
    mode: '0750'

- name: Deploy infrastructure alert rules
  ansible.builtin.template:
    src: infrastructure-alerts.yml.j2
    dest: "{{ prometheus_rules_directory }}/{{ prometheus_rules_file }}"
    owner: root
    group: prometheus
    mode: '0640'
    validate: "/usr/bin/promtool check rules %s"
  notify: Restart Prometheus

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_path }}"
    owner: root
    group: root
    mode: '0644'
    validate: "/usr/bin/promtool check config %s"
  notify: Restart Prometheus

- name: Ensure Prometheus is enabled and running
  ansible.builtin.service:
    name: "{{ prometheus_service }}"
    state: started
    enabled: true
