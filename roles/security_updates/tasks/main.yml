---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: "{{ security_updates_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure automatic APT updates
  ansible.builtin.copy:
    dest: "{{ security_updates_config_path }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "{{ security_updates_update_interval }}";
      APT::Periodic::Unattended-Upgrade "{{ security_updates_upgrade_interval }}";
      APT::Periodic::AutocleanInterval "{{ security_updates_autoclean_interval }}";
      Unattended-Upgrade::Automatic-Reboot "{{ security_updates_automatic_reboot | ternary('true', 'false') }}";

- name: Ensure APT update timer is enabled and running
  ansible.builtin.systemd:
    name: apt-daily.timer
    enabled: true
    state: started

- name: Ensure APT upgrade timer is enabled and running
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: true
    state: started
