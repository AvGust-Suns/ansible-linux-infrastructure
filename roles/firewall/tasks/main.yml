---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming_policy }}"

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing_policy }}"

- name: Allow SSH connections
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp

- name: Allow HTTP on web servers
  community.general.ufw:
    rule: allow
    port: "{{ firewall_http_port | string }}"
    proto: tcp
  when: "'web_servers' in group_names"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Allow Node Exporter access from monitoring server
  community.general.ufw:
    rule: allow
    port: "{{ firewall_node_exporter_port }}"
    proto: tcp
    from_ip: "{{ firewall_monitoring_source }}"
