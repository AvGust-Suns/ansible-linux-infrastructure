---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Grafana
  ansible.builtin.apt:
    name: "{{ grafana_package }}"
    state: present
    update_cache: true

- name: Configure Grafana listener
  ansible.builtin.ini_file:
    path: "{{ grafana_config_path }}"
    section: server
    option: http_addr
    value: "{{ grafana_listen_address }}"
    mode: '0640'
  notify: Restart Grafana

- name: Configure Grafana port
  ansible.builtin.ini_file:
    path: "{{ grafana_config_path }}"
    section: server
    option: http_port
    value: "{{ grafana_port }}"
    mode: '0640'
  notify: Restart Grafana

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: '0750'
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards

- name: Create Grafana dashboard directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'

- name: Configure Prometheus data source
  ansible.builtin.copy:
    src: provisioning/datasources/prometheus.yml
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Configure dashboard provider
  ansible.builtin.copy:
    src: provisioning/dashboards/dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Deploy infrastructure monitoring dashboard
  ansible.builtin.copy:
    src: dashboards/infrastructure-monitoring.json
    dest: /var/lib/grafana/dashboards/infrastructure-monitoring.json
    owner: grafana
    group: grafana
    mode: '0644'
  notify: Restart Grafana

- name: Ensure Grafana is enabled and running
  ansible.builtin.service:
    name: "{{ grafana_service }}"
    state: started
    enabled: true
