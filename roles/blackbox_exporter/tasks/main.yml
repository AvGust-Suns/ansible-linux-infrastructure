---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Blackbox Exporter
  ansible.builtin.apt:
    name: "{{ blackbox_exporter_package }}"
    state: present

- name: Deploy Blackbox Exporter configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Blackbox Exporter

- name: Configure Blackbox Exporter listener
  ansible.builtin.copy:
    dest: "{{ blackbox_exporter_defaults_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      ARGS="--config.file={{ blackbox_exporter_config_path }} \
      --web.listen-address={{ blackbox_exporter_web_listen_address }}"
  notify: Restart Blackbox Exporter

- name: Ensure Blackbox Exporter is enabled and running
  ansible.builtin.service:
    name: "{{ blackbox_exporter_service }}"
    state: started
    enabled: true
