---
name: Ansible CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Validate Ansible project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ansible and lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.14 ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml

      - name: Check YAML formatting
        run: yamllint .

      - name: Check playbook syntax
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/bootstrap-user.yml
          ansible-playbook --syntax-check playbooks/backup-configs.yml
          ansible-playbook --syntax-check playbooks/restore-config.yml
          ansible-playbook --syntax-check playbooks/schedule-backups.yml
          ansible-playbook --syntax-check playbooks/prometheus.yml
          ansible-playbook --syntax-check playbooks/alertmanager.yml
          ansible-playbook --syntax-check playbooks/blackbox-exporter.yml

      - name: Run Ansible Lint
        run: ansible-lint
