---
- name: Bootstrap Ansible management user
  hosts: managed_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Create Ansible user
      ansible.builtin.user:
        name: ansible
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Configure SSH public key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '/root/.ssh/ansible_ed25519.pub') }}"

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
